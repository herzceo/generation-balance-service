name: Lint (reusable)

on:
  workflow_call:

jobs:
  lint:
    name: Lint (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-uv
        with:
          sync: "true"

      - name: Format check
        run: uv run ruff format --check

      - name: Lint
        run: uv run ruff check

      - name: Type check
        run: uv run mypy backend/ tests/

      - name: Layer guard
        run: uv run python .claude/hooks/guard_layers.py < /dev/null
