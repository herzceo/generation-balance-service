name: Setup uv
description: Configure uv with caching, optionally install Python interpreters, and optionally sync dependencies

inputs:
  python-versions:
    description: Space-separated Python versions to install (e.g., "3.12 3.13")
    required: false
    default: ""
  sync:
    description: Run uv sync --frozen after setup (also validates the lock file)
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - uses: astral-sh/setup-uv@v5
      with:
        enable-caching: true

    - name: Install Python interpreters
      if: inputs.python-versions != ''
      shell: bash
      run: uv python install ${{ inputs.python-versions }}

    - name: Sync dependencies
      if: inputs.sync == 'true'
      shell: bash
      run: uv sync --frozen
