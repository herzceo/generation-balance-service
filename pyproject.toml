[project]
name = "backend"
version = "0.1.0"
description = ""
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "alembic>=1.16.5",
    "dishka>=1.7.2",
    "greenlet>=3.2.4",
    "hiredis>=3.3.1",
    "msgspec>=0.19.0",
    "psycopg[binary,pool]>=3.2.10",
    "python-dotenv>=1.1.1",
    "redis>=7.4.0",
    "sqlalchemy>=2.0.43",
]

[dependency-groups]
dev = [
    "backend",
    "mypy>=1.18.1",
    "nox>=2025.5.1",
    "pre-commit>=4.3.0",
    "pytest>=8.4.2",
    "pytest-asyncio>=0.25.0",
    "pytest-cov>=7.0.0",
    "ruff>=0.13.0",
    "testcontainers[postgres,redis]>=4.13.1",
]

[project.scripts]
backend = "backend.main.cli:main"

[tool.mypy]
files = ["backend/", "tests/"]
strict = true
strict_bytes = true
local_partial_types = true
ignore_missing_imports = true
install_types = true
non_interactive = true
extra_checks = true
disallow_untyped_defs = true
no_implicit_optional = true
check_untyped_defs = true
disallow_untyped_decorators = true
disallow_incomplete_defs = true
disallow_any_unimported = true
disallow_any_generics = true
warn_return_any = true
warn_unused_ignores = true
warn_unused_configs = true
warn_unreachable = true
pretty = true
color_output = true
show_error_codes = true
show_error_context = true
python_version = "3.12"
exclude = "(\\.venv|\\.tox|build|dist)/"

[[tool.mypy.overrides]]
module = "backend.domain.generation"
ignore_errors = true

[tool.ruff]
exclude = [".venv", ".claude", "backend/domain/generation.py"]
fix = true
unsafe-fixes = true
line-length = 100

[tool.ruff.lint]
ignore = [
  "A002",         # builtin-argument-shadowing (A002)
  "T201",         # print (T201)
  "PLR0913",      # too-many-arguments (PLR0913)
  "B008",         # function-call-in-default-argument (B008)
  "COM819",       # prohibited-trailing-comma (COM819)
  "TRY003",       # raise-vanilla-args (TRY003)
  "EM102",        # f-string-in-exception (EM102)
  "D100",         # undocumented-public-module (D100)
  "D101",         # undocumented-public-class (D101)
  "D102",         # undocumented-public-method (D102)
  "D103",         # undocumented-public-function (D103)
  "D104",         # undocumented-public-package (D104)
  "D105",         # undocumented-magic-method (D105)
  "D107",         # undocumented-public-init (D107)
  "D415",         # missing-terminal-punctuation (D415)
  "D400",         # missing-trailing-period (D400)
  "S311",         # suspicious-non-cryptographic-random-usage (S311)
  "S105",         # hardcoded-password-string (S105)
  # Typing
  "ANN401",       # any-type (ANN401)
  "TCH",          # flake8-type-checking (TCH) -- SQLAlchemy resolves annotations at runtime
  # Incompatible
  "D203",         # incorrect-blank-line-before-class (D203)
  "D212",         # multi-line-summary-first-line (D212)
  "COM812",       # missing-trailing-comma (COM812)
]
unfixable = []
select = ["ALL"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
  "S101",         # assert (S101)
  "S106",         # hardcoded-password-func-arg (S106)
  "S107",         # hardcoded-password-default-argument (test factories use fixed passwords)
  "PLR2004",      # magic-value-comparison (HTTP status literals are readable in tests)
  "ARG001",       # unused-function-argument (fixtures may be unused directly)
  "SLF001",       # private-member-access (mocks access private state for assertions)
  "TC001",        # typing-only-first-party-import -- pytest needs runtime fixture types
  "TC002",        # typing-only-third-party-import -- pytest needs runtime fixture types
  "TC003",        # typing-only-standard-library-import -- pytest needs runtime fixture types
]
"backend/domain/entities/**" = [
  "TC002",        # SQLAlchemy needs type imports at runtime for Mapped[] resolution
  "TC003",
]


[tool.ruff.lint.isort]
case-sensitive = true

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint.pydocstyle]
convention = "google"


[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
console_output_style = "progress"
addopts = "-vs -rf --cov=backend --no-cov-on-fail"
asyncio_mode = "auto"


[tool.coverage.run]
parallel = true
concurrency = ["thread", "greenlet"]
source = ["backend", "tests"]
omit = ["backend/domain/generation.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
skip_empty = true
exclude_also = [
  '@(abc\.)?abstractmethod',
  "raise NotImplementedError",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
packages = ["backend"]

[tool.uv.sources]
backend = { workspace = true }
